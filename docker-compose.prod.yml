services:
  mysql:
    image: mysql:8.0
    container_name: velocesport-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" || exit 1']
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks:
      - velocesport

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: velocesport-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DB_HOST: mysql
      RUN_PRODUCTION_SEED: ${RUN_PRODUCTION_SEED:-false}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-squadveloce-players}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-127.0.0.1}
      MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT:-9100}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - velocesport

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: velocesport-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:9100:9000'
      - '127.0.0.1:9101:9001'
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - velocesport

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: velocesport-minio-init
    restart: 'no'
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-squadveloce-players}
    networks:
      - velocesport
    entrypoint: >
      /bin/sh -c "
      set -e;
      BUCKET=\"$${MINIO_BUCKET:-squadveloce-players}\";
      i=0;
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do
        i=$$((i+1));
        if [ $$i -gt 30 ]; then echo 'MinIO no responde' >&2; exit 1; fi;
        sleep 2;
      done;
      mc mb --ignore-existing local/\"$$BUCKET\";
      mc anonymous set none local/\"$$BUCKET\";
      echo \"Bucket $$BUCKET listo (privado)\";
      "

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        ASTRO_BASE: ${ASTRO_BASE:-/profe}
        ASTRO_SITE: ${ASTRO_SITE:-http://127.0.0.1:9082}
        ASTRO_ALLOWED_ORIGINS: ${ASTRO_ALLOWED_ORIGINS:-http://127.0.0.1:9082,http://localhost:9082}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://aby.litomalone.dev/profe/login}
        JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
        JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
        JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
    container_name: velocesport-web
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      ASTRO_BASE: ${ASTRO_BASE:-/profe}
      INTERNAL_API_URL: http://backend:3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://aby.litomalone.dev/profe}
    ports:
      - '127.0.0.1:9082:4321'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - velocesport

volumes:
  mysql_data:
  minio_data:

networks:
  velocesport:
    driver: bridge
