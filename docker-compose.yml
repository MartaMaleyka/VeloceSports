services:
  mysql:
    image: mysql:8.0
    container_name: velocesport-mysql
    restart: unless-stopped
    ports:
      # Evita choque con MySQL nativo (3306) y con el frontend (8065)
      - '3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: velocesport
      MYSQL_PASSWORD: changeme
      MYSQL_DATABASE: velocesport_dev
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uvelocesport', '-pchangeme']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: velocesport-minio
    restart: unless-stopped
    ports:
      # 9100/9101 evitán choque con otros MinIO locales en 9000/9001
      - '9100:9000'
      - '9101:9001'
    env_file:
      - .env.minio
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: velocesport-minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env.minio
    entrypoint: >
      /bin/sh -c "
      set -e;
      BUCKET=\"$${MINIO_BUCKET:-squadveloce-players}\";
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\";
      mc mb --ignore-existing local/\"$$BUCKET\";
      mc anonymous set none local/\"$$BUCKET\";
      echo \"Bucket $$BUCKET listo (privado)\";
      "

volumes:
  mysql_data:
  minio_data:
